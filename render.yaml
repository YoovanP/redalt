services:
  - type: web
    name: redalt-reddit-proxy
    runtime: node
    plan: free
    buildCommand: npm --prefix fly-proxy ci --omit=dev
    startCommand: npm --prefix fly-proxy run start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ENABLE_MIRROR_FALLBACK
        value: "false"
      - key: ENABLE_PUBLIC_INSTANCE_FALLBACK
        value: "false"
      - key: ENABLE_PUBLIC_INSTANCE_DISCOVERY
        value: "false"
      - key: REDDIT_PROXY_USER_AGENT
        sync: false
      - key: REDDIT_CLIENT_ID
        sync: false
      - key: REDDIT_CLIENT_SECRET
        sync: false
      - key: REDDIT_REFRESH_TOKEN
        sync: false
      - key: REDDIT_OAUTH_ACCESS_TOKEN
        sync: false
