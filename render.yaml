services:
  - type: web
    name: redalt-reddit-proxy
    runtime: node
    rootDir: fly-proxy
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm run start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ENABLE_MIRROR_FALLBACK
        value: "true"
      - key: REDDIT_CLIENT_ID
        sync: false
      - key: REDDIT_CLIENT_SECRET
        sync: false
      - key: REDDIT_PROXY_USER_AGENT
        sync: false
